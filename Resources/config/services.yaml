services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    KimaiPlugin\MileageBundle\:
        resource: '../../*'
        exclude:
            - '../../Migrations/'
            - '../../Resources/'
            - '../../DependencyInjection/'
            - '../../Controller/'

    KimaiPlugin\MileageBundle\Controller\:
        resource: '../../Controller'
        tags: ['controller.service_arguments']
        public: true
