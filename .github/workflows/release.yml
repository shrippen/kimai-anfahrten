name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build plugin archive
        # The folder inside the zip must be named MileageBundle (Kimai plugin id).
        run: git archive --format=zip --prefix=MileageBundle/ -o "MileageBundle-${GITHUB_REF_NAME}.zip" "$GITHUB_REF_NAME"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "MileageBundle-${GITHUB_REF_NAME}.zip" --title "$GITHUB_REF_NAME" --notes "See CHANGELOG.md"
