# Tag vX.Y.Z (must match composer.json's "version").
#   ──► lint ──► build MileageBundle-X.Y.Z.zip ──► release with notes from CHANGELOG.md (if it has a
#   matching heading), zip attached.
#
# GitHub only: GitHub is the public channel and the only one with release files. Gitea runs the
# checks and gets the release without files (rule "Gitea prüft, GitHub veröffentlicht"); the job
# condition keeps it off Gitea even where Gitea reads .github/workflows.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Check version
        run: |
          version="${GITHUB_REF_NAME#v}"
          composer=$(php -r 'echo json_decode(file_get_contents("composer.json"), true)["version"];')
          if [ "$version" != "$composer" ]; then
            echo "Tag $GITHUB_REF_NAME does not match composer.json version $composer" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ZIP=MileageBundle-$version.zip" >> "$GITHUB_ENV"

      - name: Lint
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Build plugin zip
        # Kimai expects the folder name var/plugins/MileageBundle/
        run: |
          git archive --format=zip --prefix=MileageBundle/ -o "$ZIP" HEAD
          unzip -l "$ZIP"
          # The demo (screenshots) is internal: it must never ship.
          if unzip -Z1 "$ZIP" | grep -q "/demo/"; then echo "error: internal demo in $ZIP" >&2; exit 1; fi

      - name: Release notes
        run: |
          if [ -f CHANGELOG.md ] && grep -qE "^## v?$VERSION( |$)" CHANGELOG.md; then
            awk -v v="$VERSION" '
              $0 ~ "^## v?" v "( |$)" { on = 1; next }
              /^## /                  { on = 0 }
              on
            ' CHANGELOG.md > notes.md
          else
            echo "Mileage $VERSION." > notes.md
          fi

      - name: Publish on GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Mileage $VERSION" --notes-file notes.md
          fi
          gh release upload "$GITHUB_REF_NAME" "$ZIP" --repo "$GITHUB_REPOSITORY" --clobber
